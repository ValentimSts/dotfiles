name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Python dependencies
        run: pip install jinja2 pyyaml pytest
      - name: Lint shell scripts
        run: make lint
      - name: Test the colour scheme builder
        run: make test
      - name: Check that the committed colour scheme ports are up to date
        run: make color-schemes-check

# Colour variables ($bg $fg $muted $accent $success $error) come from the
# active colour scheme: colors-hyprlock.conf is a symlink managed by color-scheme.
source = ~/.config/hypr/colors-hyprlock.conf

background {
    monitor =
    color = $bg
    blur_passes = 2
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = $accent
    check_color = $success
    fail_color = $error

    font_color = $fg
    fade_on_empty = false
    rounding = 15

    position = 0, -20
    halign = center
    valign = center
}

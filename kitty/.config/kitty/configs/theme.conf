# ------------------
#
#  Theme
#
# ------------------

# Fallback only. dark-theme.auto.conf and light-theme.auto.conf next to
# kitty.conf take over whenever the desktop reports a color scheme.
# BEGIN_KITTY_THEME
# Switch with: color-scheme set <scheme> [dark|light]
include ~/.local/state/color-schemes/scheme/dark/kitty.conf
# END_KITTY_THEME

# ------------------
#
#  Settings
#
# ------------------

background_opacity 0.9
background_blur 10

remember_window_size        no
initial_window_width        950
initial_window_height       600
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
scrollback_lines            2000
wheel_scroll_min_lines      1
enable_audio_bell           no
window_padding_width        10
hide_window_decorations     yes
dynamic_background_opacity  yes
confirm_os_window_close     0
selection_foreground        none
selection_background        none

tab_bar_edge bottom
tab_bar_margin_width 1.0
#tab_bar_margin_height 5
tab_bar_style separator
tab_bar_min_tabs 2
#tab_separator " | "
tab_separator ""
tab_activity_symbol *
tab_title_template        "{fmt.fg._5c6370}{fmt.bg.default}{fmt.fg._abb2bf}{fmt.bg._5c6370} {fmt.fg.red}{activity_symbol}{fmt.fg._abb2bf}{index}: {title}{' [{}]'.format(num_windows) if num_windows > 1 else ''} {fmt.fg._5c6370}{fmt.bg.default} "
active_tab_title_template "{fmt.fg._282c34}{fmt.bg.default}{fmt.fg._abb2bf}{fmt.bg._282c34} {fmt.fg.red}{activity_symbol}{fmt.fg._abb2bf}{index}: {title}{' [{}]'.format(num_windows) if num_windows > 1 else ''} {fmt.fg._282c34}{fmt.bg.default} "
background_opacity 0.90

# Layouts: splits (manual panes) and stack (one window maximized)
enabled_layouts splits,stack

# Shell integration makes --cwd=current and prompt jumping reliable
shell_integration enabled

# Scrollback: keep more, and open it in Neovim on demand
scrollback_lines 10000
scrollback_pager nvim -c 'set ft=sh nonumber nolist' -c 'normal G' -

# Remote control over a unix socket (scripts, Neovim plugins such as smart-splits)
allow_remote_control socket-only
listen_on unix:@kitty

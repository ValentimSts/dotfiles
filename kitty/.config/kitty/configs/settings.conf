# ------------------
#
#  Settings
#
# ------------------

background_opacity 0.9
background_blur 10

remember_window_size        no
initial_window_width        950
initial_window_height       600
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
scrollback_lines            2000
wheel_scroll_min_lines      1
enable_audio_bell           no
window_padding_width        10
hide_window_decorations     yes
dynamic_background_opacity  yes
confirm_os_window_close     0
selection_foreground        none
selection_background        none

# Tab bar
tab_bar_edge              bottom
tab_bar_margin_width      1.0
tab_bar_style             powerline
tab_powerline_style       slanted
tab_bar_min_tabs          1
tab_activity_symbol       "* "
bell_on_tab               "! "
tab_title_template        "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}: {title} ({(tab.active_wd.rstrip('/').rsplit('/', 1)[-1] or '/')}){' [{}]'.format(num_windows) if num_windows > 1 else ''}"
active_tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}: {title} ({(tab.active_wd.rstrip('/').rsplit('/', 1)[-1] or '/')}){' [{}]'.format(num_windows) if num_windows > 1 else ''}"


# Layouts: splits (manual panes) and stack (one window maximized)
enabled_layouts splits,stack

# Shell integration makes --cwd=current and prompt jumping reliable
shell_integration enabled

# Scrollback: keep more, and open it in Neovim on demand
scrollback_lines 10000
scrollback_pager nvim -c 'set ft=sh nonumber nolist' -c 'normal G' -

# Remote control over a unix socket (scripts, Neovim plugins such as smart-splits)
allow_remote_control socket-only
listen_on unix:@kitty

# Panes: dim what is not focused, thin accent border, small gap
inactive_text_alpha   0.6
window_border_width   1pt
window_margin_width   2

# Notify when a long command finishes in an unfocused window
notify_on_cmd_finish invisible 10

# Cursor
cursor_shape        beam
cursor_trail        3
cursor_trail_decay  0.1 0.4

# Mouse
mouse_hide_wait     2.0
focus_follows_mouse yes

# Links
url_style dotted

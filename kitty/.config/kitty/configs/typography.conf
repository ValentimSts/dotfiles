# ------------------
#
#  Typography
#
# ------------------

font_family       Iosevka Nerd Font Mono

bold_font         auto
italic_font       auto
bold_italic_font  auto

font_size 14

# Nerd Font icons: render the Material Design range with the non-Mono variant,
# whose icons span two cells and so draw about twice as large. Used by the
# circled tab numbers and any nf-md icon in the prompt.
symbol_map U+F0001-U+F1AF0 Iosevka Nerd Font

# ------------------
#
#  Typography
#
# ------------------

font_family       Iosevka Nerd Font Mono

bold_font         auto
italic_font       auto
bold_italic_font  auto

font_size 14

# Nerd Font icons: render these ranges with the non-Mono variant, whose icons
# span two cells and so draw about twice as large. Only the Material Design
# range (circled tab numbers), the Linux logos (Arch icon in the prompt) and
# the folder, git-branch and clock glyphs; every other icon stays single-width.
symbol_map U+F0001-U+F1AF0 Iosevka Nerd Font
symbol_map U+F300-U+F32F Iosevka Nerd Font
symbol_map U+F07B Iosevka Nerd Font
symbol_map U+F418 Iosevka Nerd Font
symbol_map U+F017 Iosevka Nerd Font

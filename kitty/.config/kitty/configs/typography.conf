# ------------------
#
#  Typography
#
# ------------------

font_family       RobotoMono Nerd Font Mono

bold_font         auto
italic_font       auto
bold_italic_font  auto

font_size 14

# Nerd Font icons: render these ranges with the non-Mono variant, whose icons
# span two cells and so draw about twice as large. Only the Material Design
# range (circled tab numbers), the Linux logos (Arch icon in the prompt) and
# the folder, git-branch and clock glyphs, plus the rest of the Neovim start
# page's menu (file, copy, settings); every other icon stays single-width.
symbol_map U+F0001-U+F1AF0 Symbols Nerd Font
symbol_map U+F300-U+F32F Symbols Nerd Font
symbol_map U+F07B Symbols Nerd Font
symbol_map U+F418 Symbols Nerd Font
symbol_map U+F017 Symbols Nerd Font
symbol_map U+F15B Symbols Nerd Font
symbol_map U+F0C5 Symbols Nerd Font
symbol_map U+E615 Symbols Nerd Font

# ------------------
#
#  Typography
#
# ------------------

font_family       Iosevka Nerd Font Mono

bold_font         auto
italic_font       auto
bold_italic_font  auto

font_size 14

# Nerd Font icons: render icon ranges with the non-Mono variant, whose icons
# span two cells and so draw about twice as large. Powerline glyphs (U+E0B0
# range) are left out on purpose so segment shapes keep their single width.
symbol_map U+F0001-U+F1AF0 Iosevka Nerd Font
symbol_map U+F000-U+F2FF Iosevka Nerd Font
symbol_map U+F300-U+F32F Iosevka Nerd Font
symbol_map U+F400-U+F533 Iosevka Nerd Font
symbol_map U+E200-U+E2A9 Iosevka Nerd Font
symbol_map U+E5FA-U+E6B7 Iosevka Nerd Font

# Starship prompt. Docs: https://starship.rs/config/
# Colors are ANSI names (blue, yellow, red, ...) so the prompt takes its
# colors from whatever scheme kitty has loaded (color0-color15).
#
# Line 1: user@host  os  folder path  branch  status  (+added -removed) ... duration  clock
# Line 2: prompt character

"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$os\
$directory\
$git_branch\
$git_status\
$git_metrics\
$git_state\
$docker_context\
$fill\
$cmd_duration\
$time\
$line_break\
$character"""

# The blank line between prompts is printed by ~/.bashrc (starship_blank_line),
# which skips it on the first prompt and after clear.
add_newline = false
[username]
show_always = true
style_user = "bright-black"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bright-black"
format = "[@$hostname]($style) "

[os]
disabled = false
style = "bold blue"
format = "[$symbol]($style)  "

[os.symbols]
Arch = "\uf303"

# Full path from ~, never collapsed to the repo root, with a folder icon.
[directory]
style = "bold blue"
format = "[\uf07b  $path]($style)[$read_only]($read_only_style) "
truncation_length = 0
truncate_to_repo = false
home_symbol = "~"
read_only = " ro"

[git_branch]
symbol = "\uf418 "
style = "bold yellow"
format = "[$symbol$branch(:$remote_branch)]($style) "

# Status with counts: *N modified, +N staged, ?N untracked, !N conflicts, >N ahead, <N behind.
[git_status]
style = "bold red"
format = "([$conflicted$stashed$deleted$renamed$modified$staged$untracked$ahead_behind]($style))"
conflicted = "!${count} "
stashed = "\\$${count} "
deleted = "x${count} "
renamed = "r${count} "
modified = "*${count} "
staged = "+${count} "
untracked = "?${count} "
ahead = ">${count} "
behind = "<${count} "
diverged = ">${ahead_count} <${behind_count} "

# Lines added and removed in the working tree, like (+120 -211). Hidden when clean.
[git_metrics]
disabled = false
added_style = "bold green"
deleted_style = "bold red"
format = "(\\(([+$added]($added_style))( [-$deleted]($deleted_style))\\) )"

[git_state]
style = "bold yellow"
format = "\\([$state( $progress_current/$progress_total)]($style)\\) "

[docker_context]
symbol = "docker "
style = "blue"
format = "[$symbol$context]($style) "

# Pushes duration and clock to the right edge.
[fill]
symbol = " "

[cmd_duration]
min_time = 2000
style = "bright-black"
format = "[\uf520 $duration]($style) "

[time]
disabled = false
style = "bright-black"
format = "[\uf017  $time]($style)"
time_format = "%H:%M"

[character]
success_symbol = "[\u276f](bold green)"
error_symbol = "[\u276f](bold red)"
vimcmd_symbol = "[\u276e](bold yellow)"

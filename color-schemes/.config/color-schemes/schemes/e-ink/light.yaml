system: "base24"
name: "E-Ink"
author: "Algilbert Gomez (https://github.com/alexxGmZ), Base24 port by ValentimSts"
variant: "light"
description: "A grayscale theme aiming to imitate e-ink displays."
palette:
  base00: "#cccccc"
  base01: "#c2c2c2"
  base02: "#aeaeae"
  base03: "#5e5e5e"
  base04: "#727272"
  base05: "#474747"
  base06: "#333333"
  base07: "#7c7c7c"
  base08: "#333333"
  base09: "#868686"
  base0A: "#868686"
  base0B: "#9a9a9a"
  base0C: "#4a4a4a"
  base0D: "#727272"
  base0E: "#aeaeae"
  base0F: "#868686"
  base10: "#d6d6d6"
  base11: "#e0e0e0"
  base12: "#333333"
  base13: "#868686"
  base14: "#9a9a9a"
  base15: "#4a4a4a"
  base16: "#727272"
  base17: "#aeaeae"

# mini.base16 reads base03..base0F as syntax colours, which this terminal palette
# was not chosen for: keywords came out at 1.38:1 and strings at 1.75:1, fainter
# than comments at 4.04:1. A scheme without hues separates syntax by ink, so here
# keywords are darkest, code is readable, and only comments and punctuation fade.
nvim:
  emphasis: true
  palette:
    base03: "#6e6e6e"
    base04: "#5a5a5a"
    base07: "#262626"
    base09: "#4d4d4d"
    base0A: "#3a3a3a"
    base0B: "#575757"
    base0D: "#2e2e2e"
    base0E: "#1f1f1f"
    base0F: "#666666"
